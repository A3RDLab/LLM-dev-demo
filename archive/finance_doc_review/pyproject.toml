[project]
name = "finance-doc-review"
version = "0.1.0"
description = "金融资料审核演示：声明式规则引擎 + Pydantic AI + LangGraph 编排"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim[openai]>=2.0.0",
    "langgraph>=0.4.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.scripts]
finance-doc-review = "finance_doc_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_doc_review"]
